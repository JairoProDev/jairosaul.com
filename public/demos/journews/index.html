<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>JourNews — Feed</title>
<style>
  :root { color-scheme: dark; --bg:#050505; --card:#111; --accent:#ff2d55; --muted:#a1a1aa; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:#fff; font-family: ui-sans-serif, system-ui, sans-serif; }
  .app { height:100%; display:flex; flex-direction:column; max-width:480px; margin:0 auto; border-inline:1px solid #222; }
  header { padding:14px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #222; background:#0a0a0a; }
  .logo { font-weight:800; letter-spacing:-0.03em; }
  .logo span { color:var(--accent); }
  .chip { font-size:11px; padding:4px 8px; border-radius:999px; background:#1a1a1a; color:var(--muted); }
  .feed { flex:1; overflow-y:auto; scroll-snap-type:y mandatory; }
  .card { min-height:100%; scroll-snap-align:start; position:relative; display:flex; flex-direction:column; justify-content:flex-end; padding:24px 18px 88px; background:
    linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,.2) 45%, transparent),
    var(--img) center/cover no-repeat, #18181b; }
  .tag { display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); margin-bottom:8px; }
  h2 { margin:0 0 8px; font-size:1.55rem; line-height:1.2; }
  p { margin:0; color:#e4e4e7; line-height:1.45; font-size:.95rem; }
  .meta { margin-top:14px; font-size:12px; color:var(--muted); }
  nav { position:sticky; bottom:0; display:grid; grid-template-columns:repeat(4,1fr); background:#0a0a0acc; backdrop-filter:blur(10px); border-top:1px solid #222; padding:10px 0 env(safe-area-inset-bottom); }
  nav button { background:none; border:0; color:var(--muted); font-size:11px; display:flex; flex-direction:column; align-items:center; gap:4px; }
  nav button.active { color:#fff; }
  .dot { width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.5; }
  nav button.active .dot { opacity:1; background:var(--accent); }
  .back { color:var(--muted); text-decoration:none; font-size:12px; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <a class="back" href="/projects/journews">← Case study</a>
      <div class="logo">Jour<span>News</span></div>
      <div class="chip">MVP live</div>
    </header>
    <div class="feed" id="feed"></div>
    <nav>
      <button class="active" type="button"><span class="dot"></span>Para ti</button>
      <button type="button"><span class="dot"></span>Noticias</button>
      <button type="button"><span class="dot"></span>Video</button>
      <button type="button"><span class="dot"></span>Radio</button>
    </nav>
  </div>
<script>
const posts = [
  { tag:'Latam', title:'LATAM construye su propia capa de descubrimiento', body:'Marketplaces locales y medios verticales están reescribiendo cómo la gente encuentra oportunidades.', meta:'Hace 2h · Cusco', img:'linear-gradient(135deg,#7c2d12,#111)' },
  { tag:'Tech', title:'El feed vertical gana al timeline eterno', body:'Un post por pantalla. Menos scroll infinito, más atención real. JourNews nació para probar esa tesis.', meta:'Hace 5h · Product', img:'linear-gradient(135deg,#1d4ed8,#0f172a)' },
  { tag:'Media', title:'Noticias que se sienten como stories', body:'Formato corto, verificable y local. La base técnica lista para escalar a Noticiadis.', meta:'Hace 1d · Editorial', img:'linear-gradient(135deg,#be123c,#111)' },
  { tag:'Build', title:'MVP Next.js + feed estilo TikTok', body:'Arquitectura App Router, tabs por formato (texto, video, audio) y analytics listos.', meta:'Repo JourNews', img:'linear-gradient(135deg,#059669,#052e16)' },
];
const feed = document.getElementById('feed');
feed.innerHTML = posts.map(p => `
  <article class="card" style="--img:${p.img}">
    <div class="tag">${p.tag}</div>
    <h2>${p.title}</h2>
    <p>${p.body}</p>
    <div class="meta">${p.meta}</div>
  </article>
`).join('');
</script>
</body>
</html>
